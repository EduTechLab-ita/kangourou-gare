name: Batch Screenshot Gare

on:
  # Trigger automatico: ogni anno a settembre (gare di marzo già pubblicate, prima delle esercitazioni)
  schedule:
    - cron: '0 8 1 9 *'    # 1 settembre alle 9:00 ora italiana
    - cron: '0 8 1 10 *'   # 1 ottobre alle 9:00 (secondo tentativo)
  # Lancio manuale per anni/tipi specifici
  workflow_dispatch:
    inputs:
      anni:
        description: 'Anni da processare (separati da spazio). Lascia vuoto per anno corrente.'
        required: false
        default: ''
      tipo:
        description: 'Tipo gara (vuoto = kangourou e koala)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - kangourou
          - koala
          - benjamin
          - cadet
      n_dom:
        description: 'Numero domande (24 per Kangourou/Koala, 30 per Benjamin/Cadet)'
        required: false
        default: '24'

jobs:
  batch-screenshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze
        run: pip install pymupdf

      - name: Calcola anni e tipi da processare
        id: params
        run: |
          python - <<'EOF'
          import os
          from datetime import date

          anno_input = "${{ github.event.inputs.anni }}".strip()
          tipo_input = "${{ github.event.inputs.tipo }}".strip()
          n_dom_input = "${{ github.event.inputs.n_dom }}".strip() or "24"

          # Anno: usa input oppure anno corrente
          anni = anno_input if anno_input else str(date.today().year)

          # Tipo: usa input oppure processa kangourou e koala automaticamente
          if tipo_input:
              tipi = [(tipo_input, n_dom_input)]
          else:
              tipi = [("kangourou", "24"), ("koala", "24")]

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"anni={anni}\n")
              # Serializza come stringa separata da | per passarla al prossimo step
              tipi_str = "|".join(f"{t},{n}" for t, n in tipi)
              f.write(f"tipi={tipi_str}\n")

          print(f"Anni: {anni}")
          print(f"Tipi: {tipi}")
          EOF

      - name: Estrai screenshot
        run: |
          python - <<'EOF'
          import subprocess, sys, os

          anni = "${{ steps.params.outputs.anni }}".split()
          tipi_raw = "${{ steps.params.outputs.tipi }}".split("|")
          tipi = [t.split(",") for t in tipi_raw]

          for tipo, n_dom in tipi:
              for anno in anni:
                  print(f"\n=== Processing {tipo} {anno} ===")
                  subprocess.run(
                      [sys.executable, "extract_full_questions.py", anno, tipo, n_dom],
                      check=False
                  )
          EOF

      - name: Aggiorna versione e sw.js
        run: |
          python - <<'EOF'
          import json, re
          from datetime import date

          with open('index.json', encoding='utf-8') as f:
              idx = json.load(f)

          # Incrementa versione solo se ci sono gare nuove
          gare_disp = [g for g in idx['gare'] if g.get('disponibile')]
          versione_prima = idx['versione']

          v = idx['versione'].split('.')
          v[2] = str(int(v[2]) + 1)
          nuova_versione = '.'.join(v)

          anni = "${{ steps.params.outputs.anni }}".split()
          idx['versione'] = nuova_versione
          idx['ultimo_aggiornamento'] = str(date.today())
          idx['novita'] = f"Nuove gare {', '.join(anni)}: screenshot completo domande"

          with open('index.json', 'w', encoding='utf-8') as f:
              json.dump(idx, f, ensure_ascii=False, indent=2)

          with open('sw.js', encoding='utf-8') as f:
              sw = f.read()
          sw = re.sub(r"kangourou-trainer-v[\d.]+", f"kangourou-trainer-v{nuova_versione}", sw)
          with open('sw.js', 'w', encoding='utf-8') as f:
              f.write(sw)

          print(f"✅ Versione aggiornata: {nuova_versione}")
          EOF

      - name: Commit e push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "GitHub Actions"
          git add .
          git diff --staged --quiet && echo "Nessuna modifica" || \
            git commit -m "auto: screenshot gare ${{ steps.params.outputs.anni }}"
          git push
